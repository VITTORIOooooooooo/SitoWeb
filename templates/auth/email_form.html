{% extends "auth/_layout.html" %}
{% block titolo %}Reinvia conferma{% endblock %}
{% block riquadro %}
<div class="icona-grande">✉️</div>
<h1>Reinvia la conferma</h1>
<p class="sottotitolo">Inserisci l'email con cui ti sei registrato: ti mandiamo un nuovo link di attivazione.</p>
<form method="post" action="{{ url_for('reinvia_conferma') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus placeholder="nome@esempio.it">
    </div>
    <button class="btn pieno" type="submit">Invia link</button>
</form>
<p class="piede"><a href="{{ url_for('login') }}">Torna al login</a></p>
{% endblock %}
