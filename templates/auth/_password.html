{# Campo password con "mostra password" e indicatore di robustezza.
   Variabili: nome_campo, etichetta, id_box #}
<div class="campo">
    <label for="{{ nome_campo }}">{{ etichetta }}</label>
    <div class="campo-password">
        <input id="{{ nome_campo }}" name="{{ nome_campo }}" type="password" required minlength="8"
               autocomplete="new-password" placeholder="Almeno 8 caratteri" data-robustezza="{{ id_box }}">
        <button type="button" class="mostra-pw" data-mostra-password aria-label="Mostra password">👁️</button>
    </div>
    <div id="{{ id_box }}" style="display:grid;gap:8px;margin-top:4px">
        <div class="forza"><span></span></div>
        <ul class="requisiti">
            <li data-regola="lunghezza">8+ caratteri</li>
            <li data-regola="maiuscola">maiuscola</li>
            <li data-regola="minuscola">minuscola</li>
            <li data-regola="numero">numero</li>
        </ul>
    </div>
</div>
